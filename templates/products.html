<h1>Products</h1>

{% for p in products %}
  <h3>{{ p[1] }}</h3>

  <img src="{{ url_for('static', filename='uploads/' + p[2]) }}" width="200">

  <video width="200" controls>
    <source src="{{ url_for('static', filename='uploads/' + p[3]) }}">
  </video>
{% endfor %}
<h2>All Products</h2>

{% for p in products %}
    <h3>{{ p[1] }}</h3>
    <img src="/static/uploads/{{ p[2] }}" width="150"><br><br>
{% endfor %}

<a href="/">⬅ Back Home</a>
